<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canada Profesional Services Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  .card { transition: transform .2s, box-shadow .2s; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.12); }
  .chip.active { background-color: #6d28d9; color: white; }
  .badgeChip { border: 2px solid transparent; transition: all .15s ease; }
  .badgeChip.active {
    background-color: #6d28d9;
    color: #ffffff;
    border-color: #6d28d9;
    box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.25);
  }
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<header class="bg-gradient-to-r from-purple-900 via-purple-700 to-violet-600 text-white py-10 px-6 shadow-lg">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-4xl font-bold mb-2">🍵 Canada Professional Services Portal</h1>
    <p class="text-violet-100 text-lg">Your central hub for PS tools, AI solutions, boards, and resources</p>
  </div>
</header>
<div class="h-1.5 bg-gradient-to-r from-orange-400 via-rose-400 to-pink-400"></div>

<main class="max-w-6xl mx-auto px-6 py-8">

  <!-- Search -->
  <div class="mb-6">
    <input id="searchBox" type="text" placeholder="🔍 Search tools, boards, sites..."
      class="w-full p-3 rounded-lg border border-slate-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-violet-500"
      onkeyup="filterCards()">
  </div>

  <!-- Category Filters -->
  <div id="categoryChips" class="flex flex-wrap gap-2 mb-4">
    <button class="chip active px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="all" onclick="setCategory('all')">All</button>
    <button class="chip px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="Issue Tracking" onclick="setCategory('Issue Tracking')">Issue Tracking</button>
    <button class="chip px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="Estimation &amp; Planning" onclick="setCategory('Estimation &amp; Planning')">Estimation &amp; Planning</button>
    <button class="chip px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="Monday.com" onclick="setCategory('Monday.com')">Monday.com</button>
    <button class="chip px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="Program Boards" onclick="setCategory('Program Boards')">Program Boards</button>
    <button class="chip px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="Reporting &amp; Docs" onclick="setCategory('Reporting &amp; Docs')">Reporting &amp; Docs</button>
    <button class="chip px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="Meetings" onclick="setCategory('Meetings')">Meetings</button>
    <button class="chip px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="Methodology" onclick="setCategory('Methodology')">Methodology</button>
    <button class="chip px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="Enterprise Systems" onclick="setCategory('Enterprise Systems')">Enterprise Systems</button>
    <button class="chip px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="Client Project SharePoint Sites" onclick="setCategory('Client Project SharePoint Sites')">Client Project SharePoint Sites</button>
    <button class="chip px-4 py-2 rounded-full bg-slate-200 text-sm font-medium" data-cat="Onboarding &amp; Training" onclick="setCategory('Onboarding &amp; Training')">Onboarding &amp; Training</button>
  </div>

  <!-- Badge Filters -->
  <div class="flex gap-2 mb-8">
    <button class="badgeChip active px-3 py-1 rounded-full bg-violet-100 text-violet-800 text-xs font-semibold" data-badge="all" onclick="setBadge('all')">All Types</button>
    <button class="badgeChip px-3 py-1 rounded-full bg-violet-100 text-violet-800 text-xs font-semibold" data-badge="AI Tool" onclick="setBadge('AI Tool')">🤖 AI Tool</button>
    <button class="badgeChip px-3 py-1 rounded-full bg-violet-100 text-violet-800 text-xs font-semibold" data-badge="Tool" onclick="setBadge('Tool')">🔧 Tool</button>
  </div>

  <!-- Cards -->
  <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

</main>

<footer class="text-center text-slate-400 text-sm py-6">
  Built using MatchaOS Portal
</footer>

<script>
const tools = [
  {name:"Incident Commander – Go Live Issue Tracker", cat:"Issue Tracking", badge:"AI Tool", icon:"🚨", desc:"Matcha Mission for tracking go-live incidents and issues.", link:"https://matcha.harriscomputer.com/matcha/objects/folders?mission_id=48862&mission_name=Incident+Commander+-+Go+Live+Issue+Logger&client_id=4099&vendor_id=1"},
  {name:"IC Huddle Report Logger", cat:"Issue Tracking", badge:"AI Tool", icon:"📣", desc:"Copilot Agent to provide the Copilot Report for the Incident Commanders Running the Activation Huddle Meetings.", link:"https://m365.cloud.microsoft/chat/?titleId=T_0f615bb4-fcdb-b723-8d0e-6a242a58a0f2&source=embedded-builder"},
  {name:"Project Estimator", cat:"Estimation & Planning", badge:"AI Tool", icon:"📊", desc:"Copilot Agent to help PMs generate project estimates.", link:"https://m365.cloud.microsoft/chat/?titleId=T_af184844-590e-acab-a89e-2506431e4912&source=embedded-builder"},
  {name:"Project Budget Forecaster", cat:"Estimation & Planning", badge:"AI Tool", icon:"💰", desc:"Matcha Mission to help PMs forecast and track project budgets.", link:"https://matchaos.harriscomputer.com/#/app/MatchaMissions/mission/929b5711-f506-40dc-ba7c-a9bd0fb5a57f/chat"},
  {name:"Monday.com EPR Rollout Template", cat:"Monday.com", badge:"Tool", icon:"🗂️", desc:"Monday.com account template for setting up EPR rollout projects.", link:"https://alterahealth-force.monday.com/template_center/template/23350642"},
  {name:"Monday.com Clinic Ambulatory EPR Rollout Template", cat:"Monday.com", badge:"Tool", icon:"🗂️", desc:"Monday.com account template for setting up Clinic Ambulatory EPR rollout projects.", link:"https://alterahealth-force.monday.com/template_center/template/122231635"},
  {name:"Monday.com Template Center", cat:"Monday.com", badge:"Tool", icon:"🧩", desc:"Browse featured Monday.com templates in the Altera Health account.", link:"https://alterahealth-force.monday.com/template_center/category/account_templates"},
  {name:"Program Summarizer", cat:"Monday.com", badge:"AI Tool", icon:"🧠", desc:"Monday.com AI agent to summarize program updates & comments.", link:"https://alterahealth-force.monday.com/ai_agents/user/114604926/chat"},
  {name:"Project Progress Manager", cat:"Monday.com", badge:"AI Tool", icon:"📈", desc:"Monday.com AI agent for tracking and managing project progress.", link:"https://alterahealth-force.monday.com/ai_agents/user/105666090/editor"},
  {name:"Services Portfolio Intelligence Agent", cat:"Reporting & Docs", badge:"AI Tool", icon:"📝", desc:"Copilot Agent to consolidate status reports across projects.", link:"https://m365.cloud.microsoft/chat/?titleId=T_9f1d3626-e52d-1028-27c2-188915013a4c&source=embedded-builder"},
  {name:"Documentation Navigator", cat:"Reporting & Docs", badge:"AI Tool", icon:"🧭", desc:"AI-assisted navigation of PMO documentation.", link:"https://alteracanadapmodocunav.netlify.app/"},
  {name:"Project Activity Logger", cat:"Monday.com", badge:"AI Tool", icon:"✅", desc:"Monday.com Vibe App for logging daily project activities.", link:"https://project-activity-logger.pages.dev/"},
  {name:"Meeting Transcriber", cat:"Meetings", badge:"AI Tool", icon:"🎙️", desc:"Transcribes meeting recordings automatically.", link:"https://rutvikbhatt90.github.io/AI-Automations/Meeting_Transcriber.html"},
  {name:"Meeting Summarizer", cat:"Meetings", badge:"AI Tool", icon:"📋", desc:"Matcha tool for generating summary-style meeting notes.", link:"https://matcha.harriscomputer.com/chatbot?mission_id=4010&mission_name=Summary-Style+Meeting+Notes&client_id=4099&vendor_id=1&ms=Meeting&history_id=304210"},
  {name:"Altera Methodology Documentation", cat:"Methodology", badge:"Tool", icon:"📘", desc:"SharePoint site with Altera's project methodology documentation.", link:"https://alteradh.sharepoint.com/sites/Services/MethodologyDocs/SitePages/Methodology-Documentation.aspx"},
  {name:"ServiceNow", cat:"Enterprise Systems", badge:"Tool", icon:"🎫", desc:"Ticket, incident, and request tracking system.", link:"https://allscripts.service-now.com/now/nav/ui/classic/params/target/Coveo_Search.do"},
  {name:"Clarity PPM", cat:"Enterprise Systems", badge:"Tool", icon:"💼", desc:"Enterprise Portfolio & Project Management system.", link:"https://clarity.corp.alterahealth.com/niku/nu"},
  {name:"SK Program Overview Board", cat:"Program Boards", badge:"Tool", icon:"🗺️", desc:"Monday.com board with high-level view of the SK Program.", link:"https://alterahealth-force.monday.com/boards/18421292175/views/277788235"},
  {name:"Shared Health Manitoba – ECR Rollout Board", cat:"Program Boards", badge:"Tool", icon:"🗺️", desc:"Monday.com board tracking ECR rollout activities.", link:"https://alterahealth-force.monday.com/boards/18415653040/views/266246773"},
  {name:"Manitoba Projects", cat:"Client Project SharePoint Sites", badge:"Tool", icon:"📁", desc:"SharePoint document library for Manitoba client projects.", link:"https://alteradh.sharepoint.com/teams/ManitobaProjects/Shared%20Documents/Forms/AllItems.aspx"},
  {name:"Saskatchewan Projects", cat:"Client Project SharePoint Sites", badge:"Tool", icon:"📁", desc:"SharePoint document library for Saskatchewan client projects.", link:"https://alteradh.sharepoint.com/teams/SaskatchewanProjects/Shared%20Documents/Forms/AllItems.aspx"},
  {name:"PHSA Projects", cat:"Client Project SharePoint Sites", badge:"Tool", icon:"📁", desc:"SharePoint document library for PHSA client projects.", link:"https://alteradh.sharepoint.com/teams/PHSAProjects/Shared%20Documents/Forms/AllItems.aspx"},
  {name:"PM Onboarding", cat:"Onboarding & Training", badge:"Tool", icon:"🎓", desc:"SharePoint site with PM onboarding process documents, process recordings, and useful templates.", link:"https://alteradh.sharepoint.com/teams/Services_Canada/Shared%20Documents/Forms/AllItems.aspx?id=%2Fteams%2FServices%5FCanada%2FShared%20Documents%2FGeneral%2FCanadian%20Doc%5FMethodology%2FPM%20Onboarding&viewid=7149525c%2D1209%2D4e8f%2D99a6%2Dc4d81a478930&FolderCTID=0x012000AF481520D061FA4097F34EE67CB5A2D6"}
];

let currentCategory = 'all';
let currentBadge = 'all';

function renderCards() {
  const grid = document.getElementById('cardGrid');
  const searchTerm = document.getElementById('searchBox').value.toLowerCase();
  grid.innerHTML = '';
  tools.forEach(t => {
    if (currentCategory !== 'all' && t.cat !== currentCategory) return;
    if (currentBadge !== 'all' && t.badge !== currentBadge) return;
    if (searchTerm && !(t.name.toLowerCase().includes(searchTerm) || t.desc.toLowerCase().includes(searchTerm) || t.cat.toLowerCase().includes(searchTerm))) return;

    const badgeColor = t.badge === 'AI Tool' ? 'bg-purple-100 text-purple-700' : 'bg-slate-200 text-slate-700';
    const card = document.createElement('div');
    card.className = 'card bg-white rounded-xl p-5 shadow border border-slate-200 flex flex-col justify-between';
    card.innerHTML = `
      <div>
        <div class="flex justify-between items-start mb-2">
          <div class="flex items-center gap-3">
            <span class="text-3xl leading-none shrink-0">${t.icon}</span>
            <h3 class="font-semibold text-lg text-slate-800">${t.name}</h3>
          </div>
        </div>
        <div class="flex gap-2 mb-2 flex-wrap">
          <span class="text-xs px-2 py-1 rounded-full ${badgeColor} font-medium">${t.badge === 'AI Tool' ? '🤖 AI Tool' : '🔧 Tool'}</span>
          <span class="text-xs px-2 py-1 rounded-full bg-violet-50 text-violet-700 font-medium">${t.cat}</span>
        </div>
        <p class="text-sm text-slate-600 mb-4">${t.desc}</p>
      </div>
      ${t.comingSoon 
        ? `<span class="inline-block text-center bg-slate-200 text-slate-500 font-medium px-4 py-2 rounded-lg cursor-not-allowed">Coming Soon</span>`
        : `<a href="${t.link}" target="_blank" class="inline-block text-center bg-violet-600 hover:bg-violet-700 text-white font-medium px-4 py-2 rounded-lg transition">Open →</a>`
      }
    `;
    grid.appendChild(card);
  });
}

function setCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('#categoryChips .chip').forEach(c => c.classList.remove('active'));
  document.querySelector(`#categoryChips .chip[data-cat="${cat}"]`).classList.add('active');
  renderCards();
}

function setBadge(badge) {
  currentBadge = badge;
  document.querySelectorAll('.badgeChip').forEach(c => c.classList.remove('active'));
  document.querySelector(`.badgeChip[data-badge="${badge}"]`).classList.add('active');
  renderCards();
}

function filterCards() { renderCards(); }

renderCards();
</script>

</body>
</html>
